[project]
name = "dbaasp-target-cell"
version = "1.0.0"
description = "Recovered target-cell annotation for the DBAASP hemolytic records used by the AMPBench-MT and QMAP HC50 benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=1.4"]

[project.optional-dependencies]
# Only needed to enumerate QMAP's HC50 peptide ids when rebuilding.
build = ["qmap-benchmark>=0.1.1"]

[project.urls]
DBAASP = "https://dbaasp.org"
QMAP = "https://github.com/anthol42/QMAP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbaasp_target_cell"]
